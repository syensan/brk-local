name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Test CLI help
        run: python -m brk --help

      - name: Test compress-sensor
        run: |
          python -m brk compress-sensor examples/sample_sensor.csv test_output.brk
          python -m brk inspect test_output.brk
          python -m brk verify test_output.brk
          python -m brk decompress-sensor test_output.brk test_reconstructed.csv --step-minutes 60

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Check imports
        run: python -c "import brk; print(brk.__file__)"

      - name: Verify safety invariants in source
        run: |
          python -c "
          from brk.contracts import BRKContract
          c = BRKContract.default()
          assert c.lossless == False, 'lossless must be False'
          assert c.bit_exact_reconstruction == False, 'bit_exact must be False'
          assert c.semantic_equivalent == True, 'semantic_equivalent must be True'
          print('All safety invariants verified.')
          "
